name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goodnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y postgresql-client; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 20
          done
      - run: npm test
      - run: npm run lint
      - run: npm run test:schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/goodnote
      - run: npm run typecheck
      - run: npm run build
